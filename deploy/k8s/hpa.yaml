apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-copilot-api
  labels:
    app: ai-copilot
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-copilot-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50