apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-copilot.fullname" . }}-config
  labels:
    {{- include "ai-copilot.labels" . | nindent 4 }}
    component: config
{{- if .Values.configmap.enabled }}
data:
  {{- range $key, $value := .Values.configmap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
