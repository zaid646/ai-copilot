{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-copilot.fullname" . }}-frontend
  labels:
    {{- include "ai-copilot.labels" . | nindent 4 }}
    component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "ai-copilot.selectorLabels" . | nindent 4 }}
    component: frontend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
{{- end }}
