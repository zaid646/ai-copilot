apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-copilot.fullname" . }}-secrets
  labels:
    {{- include "ai-copilot.labels" . | nindent 4 }}
    component: secrets
type: Opaque
{{- if .Values.secrets.enabled }}
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value }}
  {{- end }}
{{- end }}
