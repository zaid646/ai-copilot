name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  forecast:
    name: Forecast (XGBoost/LightGBM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-forecast-ci.txt
      - name: Install
        run: pip install -r requirements-forecast-ci.txt
      - name: Lint
        run: ruff check forecast tests/test_forecast_features.py tests/test_xgb_forecaster.py ml/serve.py
      - name: Test (no database required)
        run: pytest --noconftest -q tests/test_forecast_features.py tests/test_xgb_forecaster.py

  api:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiocopilot
          POSTGRES_PASSWORD: aiocopilot
          POSTGRES_DB: aiocopilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiocopilot -d aiocopilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      POSTGRES_USER: aiocopilot
      POSTGRES_PASSWORD: aiocopilot
      POSTGRES_DB: aiocopilot
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      NEO4J_URI: bolt://127.0.0.1:1
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Seed warehouse
        run: python -m db.seed
      - name: Test (LLM-dependent case skipped)
        run: pytest -q tests/test_api.py -k "not test_ask_as_analyst"
