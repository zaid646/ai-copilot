name: voice-ci

on:
  push:
    branches: [main, "feature/voice-agent"]
  pull_request:

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-voice-ci.txt
      - run: pip install -r requirements-voice-ci.txt ruff
      - name: Lint
        run: ruff check voice agents/voice_support.py agents/llm_support.py core/llm.py auth integrations/ticketing.py evals tests/test_voice_pipeline.py tests/test_voice_server.py tests/test_llm_support.py tests/test_tenant_isolation.py tests/test_handoff.py tests/test_trajectory.py
      - name: Tests (CPU, no model downloads)
        run: pytest --noconftest -q tests/test_voice_pipeline.py tests/test_voice_server.py tests/test_llm_support.py tests/test_tenant_isolation.py tests/test_handoff.py tests/test_trajectory.py
      - name: Score committed trajectory traces
        run: python -m evals.trajectory_eval --mode recorded

  k8s-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeval
        run: |
          curl -sL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeval
      - name: Validate Helm chart templates
        run: |
          helm template ai-copilot ./deploy/helm/ai-copilot > /tmp/ai-copilot-rendered.yaml
          kubeval /tmp/ai-copilot-rendered.yaml --strict
      - name: Validate existing k8s manifests
        run: |
          kubeval deploy/k8s/*.yaml --strict

  terraform-validate:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: deploy/terraform/k3s-azure
        run: terraform init
      - name: Terraform validate
        working-directory: deploy/terraform/k3s-azure
        run: terraform validate
